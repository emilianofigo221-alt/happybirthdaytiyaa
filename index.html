<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk kamu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --malam:#1a1119; --malam2:#2b2030; --api:#f2b66d; --kelopak:#e9a8b8;
    --mawar:#b5404f; --teks:#f1e6ee; --redup:#a8939f;
    --serif:"Instrument Serif",Georgia,serif;
    --tulis:"Caveat","Segoe Print","Bradley Hand",cursive;
    --ui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:#0e090f;color:var(--teks);font-family:var(--ui);display:grid;place-items:center;overflow:hidden}
  :focus-visible{outline:2px solid var(--api);outline-offset:3px}

  #app{position:relative;width:100%;height:100%;max-width:430px;overflow:hidden;
       background:radial-gradient(120% 70% at 50% 0%,#2e1d33 0%,var(--malam) 60%)}
  @media(min-width:500px){
    #app{height:min(880px,96vh);border-radius:38px;border:1px solid #ffffff1c;box-shadow:0 30px 80px #000a}
  }

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;
         padding:max(30px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));
         opacity:0;pointer-events:none;transition:opacity .9s ease}
  .scene.on{opacity:1;pointer-events:auto}

  .btn{margin:0 auto;padding:.95rem 1.9rem;border-radius:999px;border:1px solid #f1e6ee33;
       background:#f1e6ee14;color:var(--teks);font:500 1rem var(--ui);cursor:pointer;
       transition:background .3s,border-color .3s}
  .btn:hover{background:#f1e6ee26;border-color:#f1e6ee66}
  .judul{font:italic 400 1.9rem/1.2 var(--serif);text-align:center}

  /* ---------- 1. LAYAR KUNCI ---------- */
  #s-lock{align-items:center;text-align:center}
  .jam{font:400 4.6rem/1 var(--serif);letter-spacing:.01em;margin-top:2vh}
  .tgl{color:var(--redup);margin-top:.5rem;font-size:.95rem}
  .gembok{width:58px;height:58px;margin-top:4vh}
  .untuk{margin-top:1rem;font:italic 400 1.35rem var(--serif)}
  .dots{display:flex;gap:16px;margin-top:2.2vh}
  .dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--kelopak);transition:background .2s}
  .dots i.isi{background:var(--kelopak)}
  .dots.goyang{animation:geleng .45s}
  .info{min-height:2.6rem;margin-top:1.2vh;color:var(--redup);font-size:.88rem;line-height:1.4;max-width:280px}
  .pad{margin-top:auto;display:grid;grid-template-columns:repeat(3,68px);gap:14px 22px}
  .pad button{height:68px;border-radius:50%;border:0;background:#ffffff12;color:var(--teks);
              font:400 1.8rem var(--serif);cursor:pointer;transition:background .15s}
  .pad button:active{background:#ffffff2e}
  .pad .hapus{font:500 .85rem var(--ui);background:none;color:var(--redup)}
  .pad .kosong{visibility:hidden}
  @keyframes geleng{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

  /* ---------- 2. PESAN ---------- */
  .chat-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid #ffffff14}
  .ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,var(--kelopak),var(--mawar))}
  .chat-head b{display:block;font-weight:500}
  .chat-head small{color:var(--redup);font-size:.8rem}
  .chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:18px 0;scrollbar-width:none}
  .chat::-webkit-scrollbar{display:none}
  .gelembung{align-self:flex-start;max-width:86%;background:var(--malam2);border-radius:4px 18px 18px 18px;
             padding:.7rem .95rem .45rem;line-height:1.45}
  .gelembung time{display:block;text-align:right;font-size:.68rem;color:var(--redup);margin-top:.25rem}
  .gelembung.ketik{display:flex;gap:5px;padding:.9rem 1rem}
  .gelembung.ketik i{width:7px;height:7px;border-radius:50%;background:var(--redup);animation:ketik 1.1s infinite}
  .gelembung.ketik i:nth-child(2){animation-delay:.18s}
  .gelembung.ketik i:nth-child(3){animation-delay:.36s}
  @keyframes ketik{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* ---------- 3. BUKET ---------- */
  #s-bunga{align-items:center}
  #buket{width:100%;max-height:54vh;margin-top:2vh;overflow:visible}
  .bunga{cursor:pointer}
  .bunga .kl{transform:scale(.3);transform-box:fill-box;transform-origin:center;
             transition:transform 1.2s cubic-bezier(.2,.9,.25,1)}
  .bunga.buka .kl{transform:scale(1)}
  .doa{min-height:6rem;margin:1vh 0 1.5vh;text-align:center;font:400 1.4rem/1.35 var(--serif);
       max-width:310px;transition:opacity .5s}
  .doa.ganti{opacity:0}
  #bunga-next{margin-top:auto}

  /* ---------- 4. SURAT ---------- */
  .surat{flex:1;overflow-y:auto;font:500 1.42rem/1.5 var(--tulis);white-space:pre-wrap;
         padding:6px 2px 24px;scrollbar-width:none;color:#f6ecf2}
  .surat::-webkit-scrollbar{display:none}
  .kursor{display:inline-block;width:2px;height:1.05em;background:var(--kelopak);margin-left:2px;
          vertical-align:-.15em;animation:kedip 1s steps(1) infinite}
  @keyframes kedip{50%{opacity:0}}
  .lewati{text-align:center;color:var(--redup);font-size:.8rem;padding-top:8px}

  /* ---------- 5. LILIN ---------- */
  #s-lilin{align-items:center;text-align:center}
  .teks-lilin{margin-top:4vh;min-height:9rem;display:flex;flex-direction:column;align-items:center;gap:.8rem}
  .teks-lilin p{font:italic 400 1.7rem/1.25 var(--serif);max-width:300px;transition:opacity .8s}
  .teks-lilin h1{font:italic 400 2.7rem/1.1 var(--serif)}
  .teks-lilin small{color:var(--redup);font-size:.95rem}
  #kue{width:min(78%,300px);margin-top:3vh}
  #kue .api{transform-origin:100px 128px;animation:kobar 1.6s ease-in-out infinite}
  #kue .glow{transition:opacity 1.4s}
  #kue .asap{opacity:0;stroke-dasharray:90;stroke-dashoffset:90}
  #kue.padam .api{animation:none;transform:scale(0);opacity:0;transition:transform .5s,opacity .5s}
  #kue.padam .glow{opacity:0}
  #kue.padam .asap{animation:asap 2.6s ease-out forwards}
  @keyframes kobar{0%,100%{transform:scale(1,1) rotate(-1.5deg)}50%{transform:scale(.94,1.07) rotate(1.5deg)}}
  @keyframes asap{0%{opacity:.7;stroke-dashoffset:90;transform:translateY(0)}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-26px)}}
  #lilin-aksi{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
  .tautan{background:none;border:0;color:var(--redup);font:400 .85rem var(--ui);cursor:pointer;text-decoration:underline;padding:6px}

  /* ---------- KELOPAK JATUH ---------- */
  #hujan{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5}
  .hujan{position:absolute;top:-30px;border-radius:70% 0 70% 0;opacity:.85;animation:jatuh linear infinite}
  @keyframes jatuh{to{transform:translate3d(var(--g),115vh,0) rotate(560deg)}}

  #catatan{position:absolute;left:18px;right:18px;bottom:max(14px,env(safe-area-inset-bottom));z-index:7;padding:.7rem 1rem;border-radius:14px;background:#000c;color:var(--teks);font-size:.82rem;line-height:1.4;text-align:center}
  #debug{position:absolute;left:12px;right:12px;top:max(8px,env(safe-area-inset-top));z-index:8;font:11px/1.35 monospace;color:#9fe3b0;background:#000a;padding:6px 8px;border-radius:8px;pointer-events:none}
  #musik{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:6;width:38px;height:38px;
         border-radius:50%;border:1px solid #ffffff22;background:#ffffff0d;color:var(--teks);cursor:pointer;font-size:1rem}


  /* Sisakan ruang di bawah agar tulisan Netlify di pojok kanan bawah tidak menutupi tombol */
  @media(max-width:500px){
    .scene{padding-bottom:max(92px,calc(env(safe-area-inset-bottom) + 84px))}
  }
  @media(max-height:760px){
    .jam{font-size:3.6rem}
    .gembok{width:44px;height:44px;margin-top:1.5vh}
    .untuk{margin-top:.5rem;font-size:1.2rem}
    .info{min-height:1.6rem}
    .pad{grid-template-columns:repeat(3,58px);gap:10px 18px}
    .pad button{height:58px;font-size:1.5rem}
    #buket{max-height:44vh}
    .teks-lilin{min-height:7rem;margin-top:2vh}
    #kue{width:min(60%,230px)}
  }

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>

<main id="app">

  <button id="musik" hidden aria-label="Nyalakan atau matikan musik">♪</button>
  <div id="hujan" aria-hidden="true"></div>
  <p id="catatan" hidden role="status"></p>
  <p id="debug" hidden></p>

  <!-- 1. LAYAR KUNCI -->
  <section class="scene on" id="s-lock">
    <div class="jam" id="jam">23.59</div>
    <p class="tgl" id="tgl"></p>
    <svg class="gembok" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M20 29v-8a12 12 0 0 1 24 0v8" stroke="#f2b66d" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="12" y="28" width="40" height="30" rx="9" fill="#2b2030" stroke="#e9a8b8" stroke-width="2"/>
      <path d="M32 50s-8-5.2-8-10.3c0-2.6 2-4.2 4.3-4.2 1.5 0 2.8.8 3.7 2.1.9-1.3 2.2-2.1 3.7-2.1 2.3 0 4.3 1.6 4.3 4.2C40 44.8 32 50 32 50z" fill="#e9a8b8"/>
    </svg>
    <p class="untuk">Dikunci khusus untuk <span class="nm"></span></p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <p class="info" id="info" role="status"></p>
    <div class="pad" id="pad"></div>
  </section>

  <!-- 2. PESAN -->
  <section class="scene" id="s-chat">
    <header class="chat-head">
      <div class="ava" aria-hidden="true"></div>
      <div><b class="pg"></b><small id="status">online</small></div>
    </header>
    <div class="chat" id="chat" aria-live="polite"></div>
    <button class="btn" id="chat-next" hidden>Lanjut</button>
  </section>

  <!-- 3. BUKET -->
  <section class="scene" id="s-bunga">
    <h2 class="judul">Sentuh bunganya satu-satu.</h2>
    <svg id="buket" viewBox="0 0 300 390" aria-label="Buket lima bunga"></svg>
    <p class="doa" id="doa" aria-live="polite"></p>
    <button class="btn" id="bunga-next" hidden>Baca suratnya</button>
  </section>

  <!-- 4. SURAT -->
  <section class="scene" id="s-surat">
    <div class="surat" id="surat"></div>
    <p class="lewati" id="lewati">Ketuk layar untuk membaca semuanya langsung</p>
    <button class="btn" id="surat-next" hidden>Satu hal lagi</button>
  </section>

  <!-- 5. LILIN -->
  <section class="scene" id="s-lilin">
    <div class="teks-lilin" id="lilin-teks"></div>
    <svg id="kue" viewBox="0 0 200 260" aria-label="Kue dengan satu lilin">
      <defs>
        <radialGradient id="cahaya">
          <stop offset="0" stop-color="#f2b66d" stop-opacity=".55"/>
          <stop offset="1" stop-color="#f2b66d" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle class="glow" cx="100" cy="112" r="86" fill="url(#cahaya)"/>
      <ellipse cx="100" cy="252" rx="82" ry="8" fill="#2b2030"/>
      <rect x="34" y="210" width="132" height="40" rx="10" fill="#8c2f3d"/>
      <rect x="40" y="190" width="120" height="28" rx="11" fill="#f1e6ee"/>
      <rect x="93" y="140" width="14" height="52" rx="3" fill="#e9a8b8"/>
      <line x1="100" y1="128" x2="100" y2="141" stroke="#3a2740" stroke-width="2.5" stroke-linecap="round"/>
      <g class="api">
        <path d="M100 128C88 112 92 98 100 84C108 98 112 112 100 128Z" fill="#f2b66d"/>
        <path d="M100 126C95 117 97 110 100 103C103 110 105 117 100 126Z" fill="#fff3d6"/>
      </g>
      <path class="asap" d="M100 124C92 112 108 104 100 92S96 72 104 62" stroke="#f1e6ee" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
    <div id="lilin-aksi">
      <button class="btn" id="tiup">Tiup lilinnya</button>
      <button class="tautan" id="ulang" hidden>Buka dari awal</button>
    </div>
  </section>
</main>

<script>
/* =========================================================
   BAGIAN YANG BOLEH KAMU GANTI (cukup edit di sini saja)
   ========================================================= */
const CONFIG = {
  nama: "Sayang",        // nama panggilan dia, contoh: "Kirana"
  pengirim: "Figo",      // namamu, tampil di header pesan dan tanda tangan surat
  hari: 24,              // tanggal lahir dia
  bulan: 11,             // bulan lahir dia (11 = November)
  jamPesan: "23.59",     // jam yang tampil di tiap pesan
  bukaPada: "",          // kosongkan agar bisa dibuka kapan saja.
                         // atau isi supaya baru bisa dibuka hari H, contoh: "2026-11-24T00:00:00"
  debug: false,          // true = tampilkan info teknis musik di atas layar (untuk cek masalah saja)
  musik: true,           // lagu sudah tertanam di file ini (lihat bagian paling bawah). false = tanpa musik

  // Pesan yang muncul satu-satu. GANTI dengan hal nyata tentang dia, makin spesifik makin kena.
  kenangan: [
    "Aku ketik ini pelan-pelan, biar nggak salah ngomong.",
    "Soalnya ada beberapa hal yang selama ini cuma aku simpan sendiri.",
    "Misalnya, aku suka cara kamu ketawa sebelum ceritanya selesai.",
    "Atau ketika kamu lagi ngambek sama aku.",
    "Hal-hal kecil begitu. Tapi itu yang paling sering aku ingat."
  ],

  // Lima doa, satu untuk tiap bunga.
  doa: [
    "Semoga kamu sehat. Itu yang pertama dan yang paling penting.",
    "Semoga capek-capekmu selalu ketemu hasilnya.",
    "Semoga ada lebih banyak hari yang pelan dan tenang buat kamu.",
    "Semoga rencana yang kamu simpan diam-diam, satu per satu jadi kenyataan.",
    "Dan semoga aku masih boleh ada di dekatmu waktu semua itu terjadi."
  ],

  // Isi surat. Tiap baris = satu paragraf. {nama} dan {pengirim} otomatis diganti.
  surat: [
    "{nama},",
    "Tiap hari, tiap bulan, aku nyari kata yang pas buat kamu, dan tiap kali itu juga aku sadar kata-kata nggak pernah benar-benar cukup. Jadi aku bikin ini saja, supaya bisa kamu buka kapan pun kamu mau.",
    "Terima kasih sudah jadi orang yang bikin hari-hari biasa terasa lebih ringan. Kamu nggak perlu jadi siapa-siapa buat bikin aku bangga. Kamu yang sekarang sudah lebih dari cukup.",
    "Hari ini umurmu bertambah. Aku cuma mau terus ada di sini, nemenin kamu jalan ke umur yang baru.",
    "Selamat ulang tahun.",
    "{pengirim}"
  ],

  penutup: "Semoga semua yang kamu doakan didengar."
};
/* =========================================================
   SELESAI. Di bawah ini kode mesinnya, tidak perlu diubah.
   ========================================================= */

const $ = s => document.querySelector(s);
const fmt = t => t.replaceAll("{nama}", CONFIG.nama).replaceAll("{pengirim}", CONFIG.pengirim);
const tidur = ms => new Promise(r => setTimeout(r, ms));
const kurangGerak = matchMedia("(prefers-reduced-motion: reduce)").matches;
const PIN = String(CONFIG.hari).padStart(2, "0") + String(CONFIG.bulan).padStart(2, "0");
let run = 0; // penanda sesi, supaya animasi lama berhenti saat "buka dari awal"

document.querySelectorAll(".nm").forEach(e => e.textContent = CONFIG.nama);
document.querySelectorAll(".pg").forEach(e => e.textContent = CONFIG.pengirim);

function pindah(id){
  document.querySelectorAll(".scene").forEach(s => s.classList.toggle("on", s.id === id));
}

/* ---------- 1. LAYAR KUNCI ---------- */
function perbaruiJam(){
  const d = new Date();
  $("#jam").textContent = d.toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"}).replace(":", ".");
  $("#tgl").textContent = d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long"});
}
perbaruiJam(); setInterval(perbaruiJam, 20000);

const pad = $("#pad");
["1","2","3","4","5","6","7","8","9","","0","Hapus"].forEach(k => {
  const b = document.createElement("button");
  b.type = "button";
  if (k === "") b.className = "kosong";
  else if (k === "Hapus") b.className = "hapus";
  b.textContent = k;
  b.setAttribute("aria-label", k === "Hapus" ? "Hapus angka terakhir" : k === "" ? "" : "Angka " + k);
  if (k !== "") b.addEventListener("click", () => k === "Hapus" ? hapus() : tekan(k));
  pad.append(b);
});

let pin = "", salah = 0;
function gambarTitik(){
  document.querySelectorAll("#dots i").forEach((t, i) => t.classList.toggle("isi", i < pin.length));
}
function sisaKunci(){
  if (!CONFIG.bukaPada) return 0;
  return Math.max(0, new Date(CONFIG.bukaPada) - new Date());
}
function infoKunci(){
  const s = sisaKunci();
  if (!s) return false;
  const hari = Math.floor(s / 864e5), jam = Math.floor(s % 864e5 / 36e5), menit = Math.floor(s % 36e5 / 6e4);
  $("#info").textContent = "Belum waktunya. Bisa dibuka " +
    (hari ? hari + " hari " : "") + jam + " jam " + menit + " menit lagi.";
  return true;
}
infoKunci(); setInterval(() => { if (!infoKunci() && $("#info").textContent.startsWith("Belum waktunya")) $("#info").textContent = ""; }, 30000);

function tekan(d){
  if (infoKunci() || pin.length >= 4) return;
  if (CONFIG.musik) mulaiMusik();
  pin += d; gambarTitik();
  if (pin.length === 4) setTimeout(cekPin, 200);
}
function hapus(){ pin = pin.slice(0, -1); gambarTitik(); }
function cekPin(){
  if (pin === PIN){
    $("#info").textContent = "";
    pin = ""; gambarTitik(); salah = 0;
    pindah("s-chat"); mulaiChat();
  } else {
    salah++;
    const dots = $("#dots");
    dots.classList.remove("goyang"); void dots.offsetWidth; dots.classList.add("goyang");
    $("#info").textContent = salah >= 2
      ? "Petunjuk: tanggal lahirmu. Dua angka untuk tanggal, dua angka untuk bulan."
      : "Belum tepat. Coba sekali lagi.";
    pin = ""; gambarTitik();
  }
}
document.addEventListener("keydown", e => {
  if (!$("#s-lock").classList.contains("on")) return;
  if (/^[0-9]$/.test(e.key)) tekan(e.key);
  else if (e.key === "Backspace") hapus();
});

/* ---------- 2. PESAN ---------- */
function gulir(){ const c = $("#chat"); c.scrollTop = c.scrollHeight; }
async function mulaiChat(){
  const id = ++run, box = $("#chat");
  box.innerHTML = ""; $("#chat-next").hidden = true; $("#status").textContent = "online";
  await tidur(kurangGerak ? 100 : 1100); if (id !== run) return;
  for (const t of CONFIG.kenangan){
    $("#status").textContent = "mengetik…";
    const b = document.createElement("div");
    b.className = "gelembung ketik"; b.innerHTML = "<i></i><i></i><i></i>";
    box.append(b); gulir();
    await tidur(kurangGerak ? 150 : 800 + t.length * 24); if (id !== run) return;
    b.className = "gelembung"; b.innerHTML = "<span></span><time></time>";
    b.querySelector("span").textContent = fmt(t);
    b.querySelector("time").textContent = CONFIG.jamPesan;
    $("#status").textContent = "online"; gulir();
    await tidur(kurangGerak ? 100 : 650); if (id !== run) return;
  }
  $("#chat-next").hidden = false;
}
$("#chat-next").addEventListener("click", () => { pindah("s-bunga"); siapkanBuket(); });

/* ---------- 3. BUKET ---------- */
const BUNGA = [
  {x:150, y:96,  r:46, n:9, a:"#b5404f", b:"#7d2a3a"},
  {x:88,  y:156, r:38, n:8, a:"#e9a8b8", b:"#c9788f"},
  {x:212, y:156, r:38, n:8, a:"#f1e6ee", b:"#cdbcc8"},
  {x:116, y:228, r:32, n:7, a:"#f2b66d", b:"#c98a3f"},
  {x:186, y:230, r:32, n:7, a:"#d9677a", b:"#a63a50"}
];
function petal(f, skala, sudut, warna){
  let s = "";
  for (let k = 0; k < f.n; k++){
    s += `<ellipse cx="0" cy="${-f.r * .55 * skala}" rx="${f.r * .3 * skala}" ry="${f.r * .55 * skala}" fill="${warna}" transform="rotate(${k * 360 / f.n + sudut})"/>`;
  }
  return s;
}
let terbuka = new Set();
function siapkanBuket(){
  terbuka = new Set();
  $("#bunga-next").hidden = true;
  $("#doa").textContent = "";
  let svg = `<path d="M112 312 L188 312 L168 384 L132 384 Z" fill="#3a2740" stroke="#e9a8b8" stroke-opacity=".35"/>`;
  BUNGA.forEach(f => {
    svg += `<path d="M150 318 Q150 ${(318 + f.y) / 2} ${f.x} ${f.y + f.r * .3}" stroke="#6f8f72" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  });
  [[112,262,-35],[190,268,35],[132,292,-62],[170,294,62]].forEach(([x,y,r]) => {
    svg += `<ellipse cx="${x}" cy="${y}" rx="8" ry="20" fill="#6f8f72" transform="rotate(${r} ${x} ${y})"/>`;
  });
  BUNGA.forEach((f, i) => {
    svg += `<g transform="translate(${f.x} ${f.y})" class="bunga" data-i="${i}" role="button" tabindex="0" aria-label="Bunga ${i + 1}">
      <circle r="${f.r + 10}" fill="transparent"/>
      <g class="kl">${petal(f, 1, 0, f.b)}${petal(f, .72, 180 / f.n, f.a)}<circle r="${f.r * .2}" fill="#f2b66d"/></g></g>`;
  });

  document.querySelectorAll(".bunga").forEach(g => {
    const buka = () => bukaBunga(+g.dataset.i, g);
    g.addEventListener("click", buka);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); buka(); } });

}
function bukaBunga(i, g){
  g.classList.add("buka");
  terbuka.add(i);
  const d = $("#doa");
  d.classList.add("ganti");
  setTimeout(() => { d.textContent = fmt(CONFIG.doa[i] || ""); d.classList.remove("ganti"); }, 350);
  if (terbuka.size === BUNGA.length) setTimeout(() => { $("#bunga-next").hidden = false; }, 1400);
}
$("#bunga-next").addEventListener("click", () => { pindah("s-surat"); mulaiSurat(); });

/* ---------- 4. SURAT ---------- */
let lewati = false;
async function mulaiSurat(){
  const id = ++run, box = $("#surat");
  lewati = false; $("#surat-next").hidden = true; $("#lewati").hidden = false;
  const teks = CONFIG.surat.map(fmt).join("\n\n");
  box.textContent = "";
  const isi = document.createTextNode(""), kursor = document.createElement("span");
  kursor.className = "kursor"; box.append(isi, kursor);
  await tidur(kurangGerak ? 0 : 900);
  for (let i = 0; i < teks.length; i++){
    if (id !== run) return;
    if (lewati || kurangGerak){ isi.nodeValue = teks; break; }
    isi.nodeValue = teks.slice(0, i + 1);
    box.scrollTop = box.scrollHeight;
    const c = teks[i];
    await tidur(c === "\n" ? 420 : /[.!?]/.test(c) ? 320 : c === "," ? 140 : 36);
  }
  if (id !== run) return;
  kursor.remove(); $("#lewati").hidden = true; $("#surat-next").hidden = false;
  box.scrollTop = box.scrollHeight;
}
$("#s-surat").addEventListener("click", e => { if (e.target.id !== "surat-next") lewati = true; });
$("#surat-next").addEventListener("click", () => { pindah("s-lilin"); mulaiLilin(); });

/* ---------- 5. LILIN ---------- */
function mulaiLilin(){
  ++run;
  $("#kue").classList.remove("padam");
  $("#lilin-teks").innerHTML = "<p>Pejamkan mata sebentar. Buat satu permintaan.</p>";
  $("#tiup").hidden = false; $("#ulang").hidden = true;
}
$("#tiup").addEventListener("click", async () => {
  const id = run;
  $("#tiup").hidden = true;
  $("#kue").classList.add("padam");
  $("#lilin-teks").innerHTML = "";
  await tidur(kurangGerak ? 100 : 1800); if (id !== run) return;
  $("#lilin-teks").innerHTML = "<h1></h1><small></small>";
  $("#lilin-teks h1").textContent = "Selamat ulang tahun, " + CONFIG.nama + ".";
  $("#lilin-teks small").textContent = CONFIG.penutup;
  hujanKelopak();
  $("#ulang").hidden = false;
});
$("#ulang").addEventListener("click", () => {
  ++run; $("#hujan").innerHTML = ""; $("#info").textContent = ""; salah = 0; pin = ""; gambarTitik();
  pindah("s-lock"); infoKunci();
});

function hujanKelopak(){
  if (kurangGerak) return;
  const wadah = $("#hujan"), warna = ["#e9a8b8", "#b5404f", "#f1e6ee", "#d9677a"];
  wadah.innerHTML = "";
  for (let i = 0; i < 26; i++){
    const p = document.createElement("i");
    p.className = "hujan";
    const u = 8 + Math.random() * 7;
    p.style.cssText = `left:${Math.random() * 100}%;width:${u}px;height:${u * 1.4}px;background:${warna[i % 4]};` +
      `animation-duration:${7 + Math.random() * 6}s;animation-delay:${Math.random() * 6}s;--g:${(Math.random() - .5) * 140}px`;
    wadah.append(p);
  }
}

/* ---------- MUSIK (opsional) ---------- */
// Cara kerja: coba pemutar biasa dulu. Kalau diblokir (misalnya di preview aplikasi),
// otomatis pindah ke Web Audio yang lebih tahan blokir.
let htmlGagal = false, audio = null, ctx = null, bufferLagu = null, modeMusik = "", musikNyala = false, dimatikan = false, sedang = false;
function byteLagu(){
  const biner = atob(LAGU.split(",")[1]), arr = new Uint8Array(biner.length);
  for (let i = 0; i < biner.length; i++) arr[i] = biner.charCodeAt(i);
  return arr;
}
const VERSI = "v9";
function lapor(t){ if (!CONFIG.debug) return; const d = $("#debug"); d.hidden = false; d.textContent = VERSI + " | " + t; }
function tandaiMusik(){ $("#musik").style.opacity = musikNyala ? 1 : .45; }
function catat(teks){
  const c = $("#catatan"); c.textContent = teks; c.hidden = false;
  setTimeout(() => { c.hidden = true; }, 7000);
}
async function putarWeb(){
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") await Promise.race([ctx.resume(), new Promise(r => setTimeout(r, 1500))]);
  if (ctx.state !== "running") throw new Error("suara diblokir (" + ctx.state + ")");
  if (!bufferLagu){
    const arr = byteLagu();
    bufferLagu = await new Promise((ok, gagal) => ctx.decodeAudioData(arr.buffer, ok, gagal));
  }
  const sumber = ctx.createBufferSource(), gain = ctx.createGain();
  sumber.buffer = bufferLagu; sumber.loop = true; gain.gain.value = .7;
  sumber.connect(gain); gain.connect(ctx.destination); sumber.start(0);
  modeMusik = "web";
}
async function nyalakan(){
  if (!CONFIG.musik || musikNyala || dimatikan || sedang) return;
  sedang = true; lapor("mencoba memutar lagu...");
  const tunggu = ms => new Promise(r => setTimeout(r, ms));
  try {
    let jalan = false;
    if (modeMusik !== "web" && !htmlGagal){
      try {
        if (!audio){
          audio = new Audio(URL.createObjectURL(new Blob([byteLagu()], {type:"audio/mpeg"})));
          audio.loop = true; audio.volume = .7;
        }
        await Promise.race([audio.play(), tunggu(1500).then(() => { throw new Error("timeout"); })]);
        modeMusik = "html"; jalan = true; lapor("OK: lagu berjalan (pemutar biasa)");
        // cek diam-diam: kalau ternyata tidak ada suara, pindah ke cara cadangan
        setTimeout(() => {
          if (modeMusik === "html" && (audio.paused || audio.currentTime < 0.05)){
            modeMusik = ""; musikNyala = false; htmlGagal = true; try { audio.pause(); } catch (x) {}
            nyalakan();
}
        }, 900);
      } catch (e) {
        try { audio && audio.pause(); } catch (x) {}
        modeMusik = "";
        lapor("pemutar biasa gagal (" + (e && e.name ? e.name : e) + "), coba cara cadangan...");
      }
    }
    if (!jalan){
      if (modeMusik === "web") await ctx.resume(); else await putarWeb();
      lapor("OK: lagu berjalan (cara cadangan)");
    }
    musikNyala = true;
  } catch (e) {
    lapor("GAGAL total: " + (e && e.name ? e.name : e)); // tanpa pesan untuk pengunjung
  }
  sedang = false; tandaiMusik();
}
function matikan(){
  dimatikan = true; musikNyala = false;
  if (modeMusik === "html") audio.pause(); else if (modeMusik === "web") ctx.suspend();
  tandaiMusik();
}
function mulaiMusik(){ nyalakan(); }
if (CONFIG.musik){
  lapor("siap. alamat=" + location.protocol + " | ketuk angka untuk mulai");
  const t = $("#musik"); t.hidden = false; t.style.opacity = .45;
  t.addEventListener("click", async () => {
    if (musikNyala) matikan(); else { dimatikan = false; await nyalakan(); }
  });
  // coba nyalakan di setiap sentuhan/tekan sampai berhasil
  ["click", "touchend", "pointerup", "keydown"].forEach(ev => document.addEventListener(ev, nyalakan));
}
